services:
  spam-scanner:
    image: spam-scanner:latest
    build: .
    env_file: .env
    depends_on:
      - rspamd
    restart: unless-stopped
    environment:
      # Hardcode internal Rspamd URL for service-to-service communication
      - RSPAMD_URL=http://rspamd:11334
      # RSPAMD_PASSWORD comes from env_file above, not restated here (see .env)
    networks:
      - spam-network

  rspamd:
    image: rspamd/rspamd:latest
    ports:
      # Loopback-only: the controller/web UI holds Bayes training and map
      # data, so it must never be reachable from the LAN or internet. Access
      # remotely via an SSH tunnel (ssh -L 11334:localhost:11334 host).
      # The proxy worker (11332) is not used by this project and isn't published.
      - "127.0.0.1:11334:11334"
    volumes:
      - ./rspamd/config:/etc/rspamd/local.d
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/rspamd/data:/var/lib/rspamd
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/rspamd/logs:/var/log/rspamd
    depends_on:
      - redis
      - unbound
    restart: unless-stopped
    networks:
      - spam-network

  redis:
    image: redis:alpine
    volumes:
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/redis:/data
    restart: unless-stopped
    networks:
      - spam-network

  unbound:
    image: klutchell/unbound:latest
    restart: unless-stopped
    networks:
      - spam-network

networks:
  spam-network:
    driver: bridge
