# Local development stack for rspamd, Redis, and Unbound.
#
# IMPORTANT: Always invoke via the wrapper script or with --project-directory:
#   bin/local/rspamd.sh [init|up|down|logs]
#
# Or manually from the project root:
#   docker compose --project-directory . -f bin/local/docker-compose.yml up -d
#
# Docker Compose v2 resolves .env AND relative volume paths from the project
# directory. The --project-directory flag pins that to the project root, so
# paths like ./rspamd/config resolve correctly from there.

services:
  rspamd:
    image: rspamd/rspamd:latest
    ports:
      # Loopback-only: the controller/web UI holds Bayes training and map
      # data, so it must never be reachable from the LAN or internet.
      # The proxy worker (11332) is not used by this project and isn't published.
      - "127.0.0.1:11334:11334"
    volumes:
      - ./rspamd/config:/etc/rspamd/local.d
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/rspamd/data:/var/lib/rspamd
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/rspamd/logs:/var/log/rspamd
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/rspamd/maps:/etc/rspamd/maps
    depends_on:
      - redis
      - unbound
    restart: unless-stopped
    networks:
      - spam-network

  redis:
    image: redis:alpine
    volumes:
      - ${SPAM_SCANNER_DATA:?Set SPAM_SCANNER_DATA in .env to an absolute path}/redis:/data
    restart: unless-stopped
    networks:
      - spam-network

  unbound:
    image: klutchell/unbound:latest
    restart: unless-stopped
    networks:
      - spam-network

networks:
  spam-network:
    driver: bridge
