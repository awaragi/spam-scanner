context: |
  npm-workspaces monorepo for a multi-mailbox IMAP spam scanner: a NestJS
  server (server/) runs one runner per mailbox and exposes an HTTP control
  API; an Angular UI (front/) drives it. Rspamd is a stateless content
  scorer shared across mailboxes via HTTP (/checkv2, /learnham, /learnspam) -
  it has no list or mailbox awareness. Whitelist/blacklist matching, scan
  state, and IDLE orchestration all live in app code; per-mailbox state
  (scanner progress, whitelist, blacklist, settings overrides) is stored as
  JSON in that mailbox's own IMAP state folder, not a local file or database.
  Deployment is Docker Compose (server, rspamd, redis, unbound); a separate
  bin/local/docker-compose.yml drives local dev, both project-scoped so they
  can coexist.
  Testing: vitest (`npm test`), run in CI alongside oxlint and the
  dependency-cruiser layer check (`npm run lint`). openspec is the process of
  record for design/plan/spec work - `docs/features/` (an earlier, informal
  design-doc convention) has been retired in favor of it.

