name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Turbo (not the bare npm scripts): `server` imports `shared`'s built
      # output, so lint/test need `shared` built first - turbo's `^build`
      # task dependency (turbo.json) handles that automatically, and also
      # covers `shared`'s and `front`'s own test suites, not just `server`'s.
      - run: npx turbo run lint

      - run: npm run format:check

      - run: npx turbo run test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: false
